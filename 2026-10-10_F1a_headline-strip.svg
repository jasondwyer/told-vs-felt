   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(568.368 261.618763)">+pole label / valid sessions</text>
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(568.368 271.418762)">as published 55/102,</text>
   <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(568.368 281.156966)">Δ = +0.039, p = .244</text>
  </g>
  <g id="text_24">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(25.2 301.526531)">THE LABEL.  Links 1–4 are asserted (link 4's base point is descriptive). Link 5 is reported with its label pending the told positive control: a null on a felt channel needs a channel</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(25.2 312.776531)">verifiably open, and the pre-registered control has not run. Inside links 2, 3 and 5, individual cells are “concluded, not answered” — the OLMo dose escalation, the first echo</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #111827" transform="translate(25.2 324.026531)">confirmatory stage, and e2b, the weight channel and the OLMo base row. Those cells assert nothing, and the base row stays that way permanently.</text>
  </g>
